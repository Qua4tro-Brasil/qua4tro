<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="robots"
        content="noindex"
    >

    <title>Página não encontrada | Qua4tro Brasil</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {
            min-height: 100vh;
            padding: 40px 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #080808;
            color: #ffffff;

            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }


        main {
            max-width: 800px;
            text-align: center;
        }


        span {
            color: #ffa51f;
            font-size: 10px;
            font-weight: 900;
            letter-spacing: 3px;
        }


        h1 {
            margin-top: 20px;

            font-size: clamp(
                70px,
                14vw,
                160px
            );

            line-height: 0.8;
            letter-spacing: -8px;
        }


        p {
            max-width: 540px;
            margin: 35px auto 0;

            color: #888;

            font-size: 15px;
            line-height: 1.7;
        }


        a {
            display: inline-flex;

            margin-top: 35px;
            padding: 17px 25px;

            background: #ffa51f;
            color: #080808;

            text-decoration: none;

            font-size: 9px;
            font-weight: 900;
            letter-spacing: 1.5px;

            transition: 0.25s ease;
        }


        a:hover {
            transform: translateY(-3px);
        }

    </style>

</head>


<body>

    <main>

        <span>
            QUA4TRO BRASIL
        </span>

        <h1>
            404
        </h1>

        <p>
            A página que você tentou acessar não foi encontrada.
        </p>

        <a href="/">
            VOLTAR PARA QUA4TRO
        </a>

    </main>

</body>

</html>
